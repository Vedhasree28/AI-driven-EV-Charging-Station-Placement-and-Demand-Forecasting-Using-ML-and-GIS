<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329" />
      <stop offset="100%" stop-color="#022524" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#badgeBg)" stroke="#10b981" stroke-width="2.5" />

  <!-- Outer Energy Ring / Arc -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Bold Central EV Lightning Symbol -->
  <path d="M36 8 L18 34 L32 34 L26 56 L48 26 L34 26 Z" 
        fill="url(#accentGreen)" 
        stroke="#6ee7b7" 
        stroke-width="1.2" 
        filter="url(#neonGlow)" />
        
  <!-- Power Spark Highlight -->
  <circle cx="36" cy="12" r="2.5" fill="#f8fafc" />
</svg>
